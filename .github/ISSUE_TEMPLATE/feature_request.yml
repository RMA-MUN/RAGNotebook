name: Feature Request
description: 为这个项目提一个建议或想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能以及为什么它对你有用。

  - type: textarea
    id: problem
    attributes:
      label: 相关痛点
      description: 这个功能请求是否与某个问题相关？请描述。
      placeholder: 当...的时候，我总是觉得很麻烦，因为...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望看到什么行为或功能？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的替代方案或变通方法

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何额外的上下文、截图或参考资料（如其他项目的类似功能）
