name: Bug Report
description: 报告一个 Bug 帮助我们改进
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告这个问题！请尽可能详细地描述你遇到的问题。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述这个 Bug 是什么
      placeholder: 当我...的时候，发生了...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个行为？
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 向下滚动到 '...'
        4. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 清晰简洁地描述你期望发生的事情
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如果适用，添加截图或错误日志来帮助解释你的问题
      placeholder: 拖拽图片到此处或粘贴日志

  - type: dropdown
    id: llm_type
    attributes:
      label: LLM 类型
      description: 你使用的是哪种 LLM 后端？
      options:
        - 阿里云百炼 (DashScope)
        - Ollama (本地)
        - 其他
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python 版本
      description: 你使用的 Python 版本
      placeholder: 3.12.4

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何其他有助于解决问题的上下文信息
